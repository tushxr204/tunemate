<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunemate — find friends through music</title>
<meta name="description" content="Tunemate matches you with people who love the same music. Play real songs, chat with friends and play music games.">
<meta name="theme-color" content="#09090d">
<meta property="og:title" content="Tunemate — find friends through music">
<meta property="og:description" content="Match with people who share your music taste, chat, and play music games.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090d;--panel:#13131a;--panel2:#1b1b25;--panel3:#24242f;--line:#2a2a36;
  --text:#f3f3f6;--muted:#9a9aab;--dim:#6d6d7d;
  --acc:#1ed78a;--acc2:#7b5cff;--pink:#ff5c8a;--warn:#ffb547;--blue:#3fb5ff;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr 88px;height:100vh}
body.ob .app{grid-template-columns:1fr;grid-template-rows:1fr}
body.ob .side,body.ob .player,body.ob .mnav{display:none!important}
/* sidebar */
.side{grid-row:1;background:#000;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #15151c}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.5px;padding:0 10px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--pink),var(--acc));display:grid;place-items:center;font-size:17px;flex:none}
.nav{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:500;transition:.15s;position:relative;text-align:left}
.nav:hover{color:var(--text);background:#111118}
.nav.on{color:var(--text);background:var(--panel2)}
.nav svg{width:21px;height:21px;flex:none}
.nav .badge{margin-left:auto}
.badge{background:var(--acc);color:#04150d;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.side .me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);cursor:pointer}
.side .foot{font-size:12px;color:var(--dim);padding:10px 10px 0;line-height:1.5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
.dot.live{background:var(--acc);box-shadow:0 0 8px var(--acc)}
/* main */
.main{grid-row:1;overflow-y:auto;background:linear-gradient(180deg,var(--hero,#1a1530) 0,var(--bg) 340px);transition:background .6s}
.inner{padding:28px 34px 60px;max-width:1180px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
h2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h2 .more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
h2 .more:hover{color:var(--text)}
.sub{color:var(--muted);margin-top:6px;line-height:1.45}
.banner{background:#2a2110;border:1px solid #5a4416;color:#ffd88a;padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;line-height:1.45}
.banner.info{background:#0f1f2a;border-color:#1d4058;color:#a9dcff}
.grid{display:grid;gap:16px}
.st-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.station{background:var(--panel);border-radius:var(--r);padding:12px;transition:.2s;position:relative;cursor:pointer}
.station:hover{background:var(--panel2)}
.cover{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:52px;position:relative;overflow:hidden;box-shadow:0 8px 24px #0007}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#ffffff30,transparent 55%);pointer-events:none}
.cover .ini{font-weight:900;font-size:30px;letter-spacing:-1px;position:absolute;left:12px;bottom:8px;text-shadow:0 2px 10px #0006}
.station .t{font-weight:600;margin-top:11px}
.station .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.playfab{position:absolute;right:20px;top:calc(100% - 118px);width:46px;height:46px;border-radius:50%;background:var(--acc);color:#04150d;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 18px #0009}
.station:hover .playfab,.station.playing .playfab{opacity:1;transform:none}
.playfab svg{width:20px;height:20px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px}
.eq i{width:3px;background:var(--acc);animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.card{background:var(--panel);border-radius:var(--r);padding:18px;border:1px solid #1d1d27}
.av{border-radius:50%;display:grid;place-items:center;flex:none;font-size:22px;width:48px;height:48px;position:relative}
.av.lg{width:88px;height:88px;font-size:42px}
.av.xl{width:120px;height:120px;font-size:58px}
.av.sm{width:34px;height:34px;font-size:16px}
.av .on{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--acc);border:2px solid var(--panel)}
.row{display:flex;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel3);border:1px solid transparent;border-radius:30px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.hl{background:#123b2a;color:#7ff0bd;border-color:#1c5a40}
.chip.btn{cursor:pointer;transition:.12s}
.chip.btn:hover{color:var(--text);border-color:var(--line)}
.chip.btn.on{background:var(--acc);color:#04150d;font-weight:600}
.chips.big .chip{font-size:14.5px;padding:9px 16px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#2d2d3a;color:var(--muted);vertical-align:2px}
.btnp{background:var(--acc);color:#04150d;font-weight:700;border-radius:30px;padding:10px 20px;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btnp:hover{transform:scale(1.03);background:#3ef0a2}
.btnp svg,.btns svg{width:18px;height:18px;flex:none}
.btnp:disabled{opacity:.45;transform:none;cursor:default}
.btnp.lg{padding:14px 30px;font-size:17px}
.btns{border:1px solid #4a4a5a;font-weight:600;border-radius:30px;padding:9px 18px;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--text)}
.btns:hover{border-color:var(--text)}
.btns.ok{border-color:#1c5a40;color:#7ff0bd}
.btns.sm,.btnp.sm{padding:6px 13px;font-size:13px}
.btns.danger{border-color:#6b1b3a;color:#ff8fb0}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--text);background:var(--panel3)}
.social{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border-radius:20px;background:var(--panel3);color:var(--text);text-decoration:none}
.social:hover{background:#30303d}
.social svg{width:15px;height:15px}
.muted{color:var(--muted)}.small{font-size:13px}
/* match */
.m-grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.match{display:flex;flex-direction:column;gap:13px}
.ring{--p:50;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#2a2a36 0);display:grid;place-items:center;flex:none;margin-left:auto}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:15px;text-align:center}
.ring b small{font-size:9px;color:var(--muted);display:block;line-height:1;margin-top:-2px}
.quote{font-size:13.5px;color:#c9c9d6;line-height:1.45}
.mini-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.mini{min-width:170px;background:var(--panel);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:.15s}
.mini:hover{background:var(--panel2)}
.mini .av{margin:0 auto 10px}
.dna{display:grid;gap:10px}
.bar{height:8px;border-radius:5px;background:#2a2a36;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.dna .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px}
/* checklist */
.check{display:grid;gap:8px}
.check .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:14px}
.check .it .bx{width:22px;height:22px;border-radius:50%;border:2px solid #4a4a5a;display:grid;place-items:center;font-size:12px;flex:none}
.check .it.done{color:var(--muted)}
.check .it.done .bx{background:var(--acc);border-color:var(--acc);color:#04150d}
.check .it button{margin-left:auto}
/* forms */
.form{display:grid;gap:22px}
.field label{display:block;font-weight:600;margin-bottom:8px}
.field .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc)}
.inp.lg{font-size:20px;padding:15px 16px;border-radius:12px}
.inp-wrap{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding-left:12px}
.inp-wrap:focus-within{border-color:var(--acc)}
.inp-wrap .inp{border:0;background:none}
.inp-wrap svg{width:18px;height:18px;flex:none}
input[type=range]{width:100%;accent-color:var(--acc)}
.range-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{width:44px;height:44px;border-radius:12px;background:var(--panel2);font-size:22px;border:2px solid transparent;transition:.12s}
.pick button:hover{transform:scale(1.08)}
.pick button.on{border-color:var(--acc)}
.pick .col{border-radius:50%}
.err{color:var(--pink);font-size:13.5px;min-height:18px}
/* onboarding */
.landing{min-height:100vh;display:grid;place-items:center;padding:40px 20px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
.land-in{position:relative;max-width:980px;width:100%;text-align:center}
.land-in .logo{width:64px;height:64px;font-size:32px;border-radius:18px;margin:0 auto 22px}
.land-in h1{font-size:clamp(36px,6vw,64px);letter-spacing:-2px;font-weight:900}
.land-in h1 span{background:linear-gradient(90deg,var(--acc),var(--blue),var(--acc2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.land-in .sub{font-size:18px;max-width:600px;margin:16px auto 0}
.bigeq{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:46px;margin:30px 0}
.bigeq i{width:7px;border-radius:4px;background:linear-gradient(var(--acc),var(--acc2));animation:eq2 1.2s infinite ease-in-out}
@keyframes eq2{0%,100%{height:8px}50%{height:46px}}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:36px 0 10px;text-align:left}
.feat{background:#13131acc;border:1px solid #23232e;border-radius:16px;padding:18px;backdrop-filter:blur(6px)}
.feat .e{font-size:28px}.feat b{display:block;margin:10px 0 4px}.feat p{font-size:13px;color:var(--muted);line-height:1.45}
.floaty{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px;opacity:.85}
.floaty span{font-size:13px;padding:6px 12px;border-radius:20px;background:#1b1b25;border:1px solid #2a2a36;color:#c9c9d6}
.ob-wrap{max-width:1040px;margin:0 auto;padding:30px 24px 50px;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;min-height:100vh;align-content:center}
.ob-card{background:var(--panel);border:1px solid #23232e;border-radius:20px;padding:30px}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{flex:1;height:5px;border-radius:5px;background:#2a2a36;transition:.3s}
.steps i.on{background:var(--acc)}
.ob-card h1{font-size:30px}
.ob-nav{display:flex;align-items:center;gap:12px;margin-top:26px}
.ob-nav .grow{flex:1}
.preview{position:sticky;top:30px;align-self:start}
.preview .card{text-align:center;padding:26px}
.preview .av{margin:0 auto 12px}
/* library */
.lib-grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.trk{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;padding:8px 12px;border-radius:8px}
.trk:hover{background:#ffffff0a}
.trk .n{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.trk .tt{font-weight:500}
.trk .aa{font-size:13px;color:var(--muted)}
.trk .acts{display:flex;align-items:center;gap:6px}
.heart{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:17px}
.heart:hover{color:var(--text)}
.heart.on{color:var(--acc)}
.lnk{font-size:12px;font-weight:600;padding:5px 10px;border-radius:14px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.lnk.sp{background:#14402b;color:#7ff0bd}.lnk.yt{background:#4a1520;color:#ff9aa8}
.lnk:hover{filter:brightness(1.25)}
.lnk svg{width:13px;height:13px}
.pl-head{display:flex;align-items:flex-end;gap:24px;margin-bottom:22px}
.pl-head .cover{width:190px;height:190px;font-size:80px;flex:none}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:30px;padding:0 16px;max-width:420px}
.search input{border:0;outline:none;background:none;color:#000;padding:11px 0;width:100%}
/* friends/chat */
.fr-wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;height:calc(100vh - 88px - 150px);min-height:420px}
.fr-list{background:var(--panel);border-radius:var(--r);overflow-y:auto;padding:8px}
.fr-sec{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:700;padding:12px 10px 6px}
.fr{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer}
.fr:hover{background:var(--panel2)}
.fr.on{background:var(--panel3)}
.fr .nm{font-weight:600;font-size:14.5px}
.fr .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.chat{background:var(--panel);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.chat-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:72%;padding:9px 13px;border-radius:16px;background:var(--panel3);line-height:1.4;word-wrap:break-word;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--acc);color:#04150d;border-bottom-right-radius:5px}
.msg.them{border-bottom-left-radius:5px}
.msg .tm{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12.5px;text-align:center}
.chat-f{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.chat-f .inp{border-radius:30px}
.quick{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;gap:10px;height:100%}
.empty .big{font-size:46px}
/* games */
.g-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gcard{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s}
.gcard:hover{background:var(--panel2);transform:translateY(-2px)}
.gcard .cover{aspect-ratio:auto;height:110px;font-size:50px}
.gcard .best{font-size:12.5px;color:var(--muted);margin-top:auto}
.stage{background:var(--panel);border-radius:var(--r);padding:24px;margin-bottom:24px;border:1px solid #2a2a36;text-align:center;scroll-margin-top:20px}
.stage-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;text-align:left}
.stage-h b{font-size:19px}
.stage-h .x{margin-left:auto}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px;margin:14px auto;justify-content:center}
.ttt button{width:90px;height:90px;border-radius:14px;background:var(--panel3);font-size:44px;font-weight:800;transition:.12s}
.ttt button:hover:not(:disabled){background:#30303e}
.ttt button.x{color:var(--acc)}.ttt button.o{color:var(--pink)}
.ttt button.win{background:#123b2a}
canvas.rh{display:block;width:100%;max-width:440px;height:480px;margin:10px auto;border-radius:14px;background:#07070b;touch-action:none}
.lb{display:grid;gap:4px;margin-top:6px}
.lb .r{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:14px}
.lb .r:nth-child(odd){background:#ffffff06}
.lb .r.me{background:#123b2a55}
.lb .n{width:22px;color:var(--dim);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:20px auto 0}
.opt{background:var(--panel3);border-radius:12px;padding:16px;font-weight:600;font-size:16px;transition:.12s;border:2px solid transparent}
.opt:hover:not(:disabled){background:#30303e;border-color:#4a4a5a}
.opt.right{background:#123b2a;border-color:var(--acc);color:#7ff0bd}
.opt.wrong{background:#4a1520;border-color:var(--pink);color:#ffb0c2}
.qtitle{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-1px;margin:10px 0 4px}
.tbar{height:6px;border-radius:4px;background:#2a2a36;overflow:hidden;max-width:560px;margin:14px auto 0}
.tbar i{display:block;height:100%;background:var(--acc);width:100%}
.hud{display:flex;justify-content:center;gap:22px;font-size:14px;color:var(--muted)}
.hud b{color:var(--text);font-size:18px}
.pads{display:grid;grid-template-columns:repeat(2,130px);gap:14px;justify-content:center;margin:22px auto}
.pad{width:130px;height:130px;border-radius:24px;opacity:.45;transition:opacity .08s,transform .08s}
.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 30px currentColor}
.tapbtn{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3ef0a2,#0b6b4f);color:#04150d;font-size:22px;font-weight:800;margin:20px auto;display:grid;place-items:center;transition:transform .06s;box-shadow:0 12px 40px #1ed78a40;user-select:none}
.tapbtn:active,.tapbtn.hit{transform:scale(.94)}
.seq{display:grid;grid-template-columns:90px repeat(16,1fr);gap:4px;margin:16px 0;overflow-x:auto;min-width:0}
.seq .lab{font-size:12.5px;color:var(--muted);text-align:left;align-self:center;font-weight:600}
.cell{aspect-ratio:1;min-width:22px;border-radius:5px;background:#24242f;transition:background .08s}
.cell:nth-child(17n+6),.cell:nth-child(17n+10),.cell:nth-child(17n+14){}
.cell.beat{background:#2c2c3a}
.cell.on{background:var(--c,#1ed78a)}
.cell.now{outline:2px solid #fff6}
.bm-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
select.inp{cursor:pointer}
/* player */
.player{grid-column:1/-1;grid-row:2;background:#000;border-top:1px solid #1a1a22;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;padding:0 18px;gap:18px}
.np{display:flex;align-items:center;gap:13px;min-width:0}
.np .cover{width:56px;height:56px;font-size:26px;border-radius:8px;flex:none}
.np .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ss{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;align-items:center;gap:7px}
.ctl .bt{display:flex;align-items:center;gap:18px}
.ctl .pp{width:40px;height:40px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center;transition:.12s}
.ctl .pp:hover{transform:scale(1.06)}
.ctl svg{width:19px;height:19px}
.prog{display:flex;align-items:center;gap:9px;width:100%;font-size:11.5px;color:var(--muted)}
.prog .bar{flex:1;height:4px}
.prog .bar i{background:var(--text)}
.vol{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.vol input{width:110px}
.vol canvas{width:90px;height:30px}
.toasts{position:fixed;right:20px;bottom:104px;display:flex;flex-direction:column;gap:10px;z-index:50}
.toast{background:var(--panel3);border:1px solid var(--line);padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;max-width:340px;animation:tin .25s;font-size:14px;line-height:1.4}
.toast .acts{display:flex;gap:8px;margin-top:10px}
.toast .acts button{padding:6px 14px;font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.mnav{display:none}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted);gap:14px;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #2a2a36;border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hero-prof{display:flex;align-items:flex-end;gap:22px}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.scores div{background:var(--panel2);border-radius:10px;padding:12px}
.scores b{display:block;font-size:20px}
.scores span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.feats{grid-template-columns:1fr 1fr}.ob-wrap{grid-template-columns:1fr}.preview{display:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr 64px 60px}
  .side{display:none}
  .main{grid-row:1}
  .player{grid-row:2;grid-template-columns:1fr auto;padding:0 12px}
  .player .vol{display:none}
  .ctl .prog{display:none}
  .ctl .bt .icon-btn{display:none}
  .np .cover{width:44px;height:44px}
  .mnav{display:flex;grid-row:3;background:#000;border-top:1px solid #1a1a22;justify-content:space-around;align-items:center}
  .mnav button{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:3px;position:relative}
  .mnav button.on{color:var(--text)}
  .mnav svg{width:20px;height:20px}
  .mnav .badge{position:absolute;top:-4px;right:-6px;font-size:9px;padding:0 5px;min-width:0}
  .inner{padding:20px 16px 40px}
  h1{font-size:27px}
  .fr-wrap{grid-template-columns:1fr;height:auto}
  .fr-list{max-height:260px}
  .chat{height:480px}
  .two{grid-template-columns:1fr}
  .m-grid{grid-template-columns:1fr}
  .g-grid{grid-template-columns:1fr 1fr}
  .toasts{bottom:136px;right:10px;left:10px}
  .ttt{grid-template-columns:repeat(3,80px)}.ttt button{width:80px;height:80px}
  .pl-head{flex-direction:column;align-items:flex-start}.pl-head .cover{width:140px;height:140px;font-size:60px}
  .opts{grid-template-columns:1fr}
  .pads{grid-template-columns:repeat(2,120px)}.pad{width:120px;height:120px}
  .seq{grid-template-columns:56px repeat(16,minmax(16px,1fr));gap:3px}.cell{min-width:16px}
  .ob-card{padding:22px}
  .trk .lnk span{display:none}
}

/* ---- v3 additions ---- */
.auth{max-width:400px;margin:0 auto;text-align:left;padding:22px;background:#13131aee;backdrop-filter:blur(8px)}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;font-weight:600;border-radius:30px;padding:12px;transition:.15s}
.btn-google:hover{background:#ececec}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12.5px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.authf{display:grid;gap:10px}
.authf .btnp{width:100%;padding:12px}
.auth .err{margin:10px 0 4px}
.trk{grid-template-columns:34px 1fr auto}
.trk.now .tt{color:var(--acc)}
.trk-main{display:flex;align-items:center;gap:12px;min-width:0}
.trk-main .tt,.trk-main .aa{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:42px;height:42px;border-radius:6px;object-fit:cover;flex:none;background:#24242f}
.tplay{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:#ffffff10}
.tplay:hover{background:var(--acc);color:#04150d}
.tplay svg{width:13px;height:13px}
.lnk.full{background:#1d2a4a;color:#a9c8ff}
.np img.cover{object-fit:cover}
.np .heart{flex:none}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:80;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(760px,100%);position:relative;box-shadow:0 30px 80px #000}
.modal-x{position:absolute;right:10px;top:10px}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.disc{width:150px;height:150px;border-radius:50%;margin:18px auto 10px;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle,#2a2a36 0 18%,#111 19% 100%);box-shadow:0 0 0 6px #1b1b25,0 10px 40px #0008;animation:sp 4s linear infinite;overflow:hidden}
.disc img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){ .trk .lnk span{display:none} .lnk.full span{display:none} .auth{padding:18px} }
</style>
